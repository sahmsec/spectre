<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Batch Test Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #241c4d;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: radial-gradient(130% 95% at 80% -10%, rgba(139, 92, 246, 0.40), transparent 62%), linear-gradient(158deg, #241c4d 0%, #2c2360 55%, #352c6e 100%);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(167, 139, 250, 0.10);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: all 0.3s ease;
        }

        .container:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(167, 139, 250, 0.12);
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, rgb(23, 22, 46) 4%, #fff, rgb(23, 22, 46));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(45, 35, 85, 0.34);
            border-radius: 10px;
            border: 1px solid rgba(167, 139, 250, 0.10);
        }

        .status-item {
            text-align: center;
        }

        .status-number {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .status-label {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .success { color: #8b5cf6; }
        .error { color: #ff4757; }
        .total { color: #8b5cf6; }
        .progress { color: #ffa502; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
          --color: #00A97F;
          --color2: #212121;
          padding: 8px 14px;
          background-color: transparent;
          border-radius: 10px;
          border: 1.5px solid var(--color);
          transition: .5s ease;
          position: relative;
          overflow: hidden;
          cursor: pointer;
          z-index: 1;
          font-weight: 500;
          font-size: 12px;
          color: var(--color);
          line-height: 1;
        }
        .btn::before {
          content: '';
          display: block;
          height: 110%;
          width: 310%;
          transform: translate(0, -50%);
          position: absolute;
          top: 50%;
          left: -5%;
          z-index: -1;
          transition: .7s;
          background: linear-gradient(45deg, var(--color2) 33%, var(--color) 66%);
        }
        .btn:hover::before { left: -5%; }
        .btn:hover { color: var(--color2); }
        .btn:active { transform: scale(.98); filter: brightness(.9); }

        .btn-primary { --color: #8b5cf6; }

        .btn-primary:hover { }

        .btn-secondary { --color: #9ca3af; }

        .btn-secondary:hover { }

        .btn-success { --color: #27ae60; }

        .btn-success:hover { }

        .btn-danger { --color: #e74c3c; }

        .btn-danger:hover { }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-container {
            background: rgba(45, 35, 85, 0.34);
            border-radius: 10px;
            overflow: hidden;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid rgba(167, 139, 250, 0.10);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .results-table th {
            background: rgba(45, 35, 85, 0.34);
            padding: 10px 8px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid rgba(167, 139, 250, 0.12);
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s ease;
            color: #fff;
        }

        .results-table th:hover {
            background: rgba(167, 139, 250, 0.08);
        }


        .results-container::-webkit-scrollbar {
            width: 8px;
        }

        .results-container::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 4px;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.50);
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .results-container::-webkit-scrollbar-thumb:hover {
            background: rgba(167, 139, 250, 0.70);
        }


        body::-webkit-scrollbar {
            width: 8px;
        }

        body::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 4px;
        }

        body::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.50);
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        body::-webkit-scrollbar-thumb:hover {
            background: rgba(167, 139, 250, 0.70);
        }

        .sort-btn {
            display: inline-block;
            margin-left: 5px;
            font-size: 12px;
            opacity: 0.7;
            font-weight: normal;
        }

        .sort-btn.active {
            opacity: 1;
            font-weight: bold;
            color: #fff;
        }

        .results-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(167, 139, 250, 0.15);
            word-break: break-all;
        }

        .results-table tr:hover {
            background: rgba(167, 139, 250, 0.08);
        }

        .status-success {
            color: #8b5cf6;
            font-weight: bold;
        }

        .status-error {
            color: #ff4757;
            font-weight: bold;
        }

        .url-cell {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 1.1em;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            border-top-color: #8b5cf6;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
            font-size: 12px;
        }

        .filter-select {
            padding: 6px 10px;
            border: 1px solid rgba(167, 139, 250, 0.40);
            border-radius: 4px;
            background: rgba(45, 35, 85, 0.24);
            color: white;
            font-size: 11px;
        }


        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(40, 31, 76, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #ffffff; color: #241f45;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(167, 139, 250, 0.15);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(167, 139, 250, 0.30);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            color: #8b5cf6;
            font-size: 1.2em;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            color: #fff;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body p {
            margin-bottom: 20px;
            color: #fff;
        }

        .export-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .export-option {
            flex: 1;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .export-option small {
            opacity: 0.8;
            font-size: 0.8em;
        }

        .export-option:hover {
            transform: translateY(-2px);
        }
    
/* --- Spectre: white data surfaces + lavender accents --- */
.modal-content{background:#ffffff !important;color:#241f45 !important;border:1px solid #d8cef2 !important;}
.modal-content .modal-close,.modal-content .close,.modal-close{color:#6b6785 !important;}
.modal h3,.modal-header h3,.modal-content h3{color:#6d3bd6 !important;}
.modal-body,.modal-body p,.modal-body label{color:#2a2547 !important;}
.modal-header{border-bottom:1px solid #e4dcf7 !important;}
.results-container{background:#ffffff !important;border:1px solid #d8cef2 !important;border-radius:8px;}
.results-table{background:#ffffff !important;color:#2a2547 !important;}
.results-table th{background:#f1ecfb !important;color:#1e1b3a !important;border-bottom:1px solid #c9bcf0 !important;}
.results-table th:hover{background:#e9e1fb !important;}
.results-table td{color:#2a2547 !important;border-bottom:1px solid #ece7f8 !important;}
.results-table tr:hover{background:#f6f2fe !important;}
.results-table .status-success,.results-table .success{color:#6d3bd6 !important;}
.results-table .status-error,.results-table .error{color:#dc2626 !important;}
.results-container::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.55) !important;}
/* differentiated action buttons: red-transparent Delete, violet Inject, lavender Edit */
.delete-btn{background:rgba(239,68,68,0.12) !important;border:1px solid rgba(239,68,68,0.50) !important;color:#ef4444 !important;}
.delete-btn:hover{background:rgba(239,68,68,0.22) !important;border-color:rgba(239,68,68,0.70) !important;}
.inject-btn{background:rgba(139,92,246,0.18) !important;border:1px solid rgba(139,92,246,0.55) !important;color:#c4b5fd !important;}
.inject-btn:hover{background:rgba(139,92,246,0.32) !important;color:#ffffff !important;}
.modify-btn{background:rgba(167,139,250,0.08) !important;border:1px solid rgba(167,139,250,0.38) !important;color:#cbb6f5 !important;}
.modify-btn:hover{background:rgba(167,139,250,0.18) !important;}
.close-hook-btn{background:rgba(148,163,184,0.12) !important;border:1px solid rgba(148,163,184,0.40) !important;color:#cbd5e1 !important;}

    
/* ===== cohesive transparent UI: no dark ash, no hover FX, no violet bar ===== */
.action-button{background:transparent !important;border:1px solid rgba(167,139,250,0.32) !important;color:#ece9f5 !important;backdrop-filter:none !important;box-shadow:none !important;}
.action-button:hover{background:rgba(167,139,250,0.10) !important;transform:none !important;box-shadow:none !important;}
.action-button .text{color:#ece9f5 !important;}
.action-button .border-tl,.action-button .border-tr,.action-button .border-bl,.action-button .border-br,.action-button .shine{display:none !important;}
.scan-button,.scan-button:hover{background:#7c3aed !important;border:1px solid #7c3aed !important;}
.scan-button,.scan-button .text{color:#ffffff !important;}
.toggle-button{background:transparent !important;border:1px solid rgba(167,139,250,0.28) !important;color:#cbc3ea !important;box-shadow:none !important;}
.toggle-button:hover{background:rgba(167,139,250,0.10) !important;}
/* buttons on white modals need dark text */
.modal-content .action-button,.modal-content .action-button .text{background:rgba(124,58,237,0.08) !important;color:#6d28d9 !important;border:1px solid rgba(124,58,237,0.40) !important;}
.modal-content .scan-button,.modal-content .scan-button .text{background:#7c3aed !important;color:#ffffff !important;}
/* panels: subtle transparent, not dark ash */
.api-test-section{background:rgba(255,255,255,0.03) !important;border:1px solid rgba(167,139,250,0.20) !important;box-shadow:none !important;}
.api-test-section:hover{transform:none !important;box-shadow:none !important;border-color:rgba(167,139,250,0.20) !important;}
.deep-scan-config,.result-category,.progress-section,.stats{background:rgba(255,255,255,0.03) !important;}
/* subtle neutral scrollbar (removes the bright violet bar) */
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14) !important;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22) !important;}

</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>API Batch Test Results</h1>
            <p id="testInfo">Waiting for test configuration...</p>
            <p id="baseUrlInfo" style="opacity:.8;font-size:12px;margin-top:6px;"></p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-number total" id="totalCount">0</div>
                <div class="status-label">Total</div>
            </div>
            <div class="status-item">
                <div class="status-number progress" id="progressCount">0</div>
                <div class="status-label">Completed</div>
            </div>
            <div class="status-item">
                <div class="status-number success" id="successCount">0</div>
                <div class="status-label">Success</div>
            </div>
            <div class="status-item">
                <div class="status-number error" id="errorCount">0</div>
                <div class="status-label">Failed</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="continueBtn" style="display: none;">Resume Test</button>
            <button class="btn btn-secondary" id="pauseBtn" disabled>Pause Test</button>
            <button class="btn btn-success" id="exportBtn">Export Results</button>
            <button class="btn btn-danger" id="clearBtn">Clear Results</button>
        </div>

        <div class="filter-bar">
            <label>Filter:</label>
            <select class="filter-select" id="statusFilter">
                <option value="all">All</option>
                <option value="success">Success only</option>
                <option value="error">Failed only</option>
            </select>
            <select class="filter-select" id="statusCodeFilter">
                <option value="all">All status codes</option>
                <option value="2xx">2xx</option>
                <option value="3xx">3xx</option>
                <option value="4xx">4xx</option>
                <option value="5xx">5xx</option>
            </select>
            <select class="filter-select" id="domainFilter">
                <option value="all">All domains</option>
            </select>
        </div>

        <div class="results-container">
            <div class="loading" id="loadingDiv">
                <div class="spinner"></div>
                <div>Ready to start testing...</div>
            </div>
            <table class="results-table" id="resultsTable" style="display: none;">
                <thead>
                    <tr>
                        <th data-column="0">No. <span class="sort-btn" id="sort-0"></span></th>
                        <th data-column="1">Domain <span class="sort-btn" id="sort-1"></span></th>
                        <th data-column="2">URL <span class="sort-btn" id="sort-2"></span></th>
                        <th data-column="3">Status Code <span class="sort-btn" id="sort-3"></span></th>
                        <th data-column="4">Size <span class="sort-btn" id="sort-4"></span></th>
                        <th data-column="5">Time <span class="sort-btn" id="sort-5"></span></th>
                        <th data-column="6">Result <span class="sort-btn" id="sort-6"></span></th>
                        <th>View</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
        </div>
    </div>


    <div id="exportModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select Export Format</h3>
                <span class="close" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                <p>Choose the export file format:</p>
                <div class="export-buttons">
                    <button class="btn btn-primary export-option" id="exportJSON">
                        <strong>JSON Format</strong>
                        <br><small>Includes full test info and result data</small>
                    </button>
                    <button class="btn btn-success export-option" id="exportCSV">
                        <strong>CSV Format</strong>
                        <br><small>Best viewed in Excel</small>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="src/api/testwin.js"></script>
</body>
</html>
